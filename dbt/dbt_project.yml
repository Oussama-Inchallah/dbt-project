# This file is the main configuration file for your dbt project. 
# It contains information about your project, such as its name, version, and the paths to your models, snapshots, macros, and tests. 
# It also specifies the profile that dbt should use to connect to your database.
name: 'indrive_analytics'
version: '1.0.0'
config-version: 2

profile: 'indrive_analytics'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2026-01-01'

models:
  indrive_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

seeds:
  indrive_analytics:
    +schema: raw        # seeds land in schema "raw" (see macros/generate_schema_name.sql)
